<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" width="360" height="520">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2060CC"/>
      <stop offset="100%" stop-color="#091A6A"/>
    </radialGradient>

    <!-- Launcher body — white/silver metallic -->
    <linearGradient id="body-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8898b8"/>
      <stop offset="15%"  stop-color="#ddeeff"/>
      <stop offset="45%"  stop-color="#ffffff"/>
      <stop offset="75%"  stop-color="#ccdaee"/>
      <stop offset="100%" stop-color="#7888a8"/>
    </linearGradient>

    <!-- Cup gradient -->
    <linearGradient id="cup-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8090b0"/>
      <stop offset="25%"  stop-color="#e0eeff"/>
      <stop offset="55%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7888a8"/>
    </linearGradient>

    <!-- Base platform -->
    <linearGradient id="base-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c8d8ee"/>
      <stop offset="100%" stop-color="#6878a0"/>
    </linearGradient>

    <!-- Fin gradient -->
    <linearGradient id="fin-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7080a0"/>
      <stop offset="60%"  stop-color="#c0d0e8"/>
      <stop offset="100%" stop-color="#9090b0"/>
    </linearGradient>

    <!-- Loaded bubble — green -->
    <radialGradient id="b-g" cx="35%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#ccf8a0"/>
      <stop offset="45%"  stop-color="#60d030"/>
      <stop offset="100%" stop-color="#208800"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glow-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#020814" flood-opacity="0.55"/>
    </filter>
    <filter id="shadow-sm" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020814" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="360" height="520" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="44"  cy="60"  r="2"   fill="white" opacity="0.6"/>
  <circle cx="316" cy="44"  r="1.5" fill="white" opacity="0.5"/>
  <circle cx="290" cy="155" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="30"  cy="210" r="2"   fill="white" opacity="0.5"/>
  <circle cx="338" cy="310" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="22"  cy="420" r="2"   fill="white" opacity="0.4"/>
  <circle cx="328" cy="460" r="1.5" fill="white" opacity="0.35"/>

  <!-- Label -->
  <text x="180" y="42" text-anchor="middle" font-family="system-ui,sans-serif"
        font-size="12" fill="white" opacity="0.4" letter-spacing="3">CANNON DESIGN PREVIEW</text>

  <!-- ══ GROUND SHADOW ══ -->
  <ellipse cx="180" cy="458" rx="120" ry="14" fill="#020814" opacity="0.45"/>

  <!-- ══ BASE PLATFORM ══ -->
  <!-- Base shadow -->
  <ellipse cx="180" cy="446" rx="110" ry="11" fill="#020814" opacity="0.3"/>
  <!-- Base body -->
  <rect x="80" y="428" width="200" height="26" rx="13"
        fill="url(#base-grad)" stroke="#90a8c8" stroke-width="2"
        filter="url(#shadow-sm)"/>
  <!-- Base top highlight -->
  <rect x="85" y="430" width="190" height="10" rx="7" fill="white" opacity="0.22"/>
  <!-- Base bottom rim -->
  <rect x="85" y="449" width="190" height="3"  rx="1.5" fill="white" opacity="0.08"/>

  <!-- ══ 3 FINS (small supports connecting body to base) ══ -->
  <!-- Left fin -->
  <path d="M 158 396 L 118 428 L 158 428 Z"
        fill="url(#fin-grad)" stroke="#8898b8" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="158" y1="400" x2="121" y2="427"
        stroke="white" stroke-width="0.8" stroke-opacity="0.3"/>
  <!-- Right fin -->
  <path d="M 202 396 L 242 428 L 202 428 Z"
        fill="url(#fin-grad)" stroke="#8898b8" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="202" y1="400" x2="239" y2="427"
        stroke="white" stroke-width="0.8" stroke-opacity="0.3"/>
  <!-- Center fin (back, slightly shorter) -->
  <path d="M 176 400 L 168 428 L 192 428 L 184 400 Z"
        fill="#9aabcc" opacity="0.5" stroke="#8898b8" stroke-width="1"/>

  <!-- ══ LAUNCHER BODY ══ -->
  <!-- Subtle glow behind body -->
  <rect x="153" y="250" width="54" height="180" rx="27"
        fill="white" opacity="0.08" filter="url(#glow)"/>

  <!-- Main cylindrical body -->
  <rect x="155" y="255" width="50" height="170" rx="25"
        fill="url(#body-grad)" filter="url(#shadow)"/>

  <!-- Left edge highlight -->
  <rect x="159" y="262" width="9" height="154" rx="4.5"
        fill="white" opacity="0.4"/>
  <!-- Right edge shadow -->
  <rect x="193" y="262" width="7" height="154" rx="3.5"
        fill="#000" opacity="0.12"/>

  <!-- Decorative mid band -->
  <rect x="149" y="338" width="62" height="12" rx="6"
        fill="#9aaac8" stroke="#b8ccee" stroke-width="1.5"/>
  <rect x="152" y="340" width="56" height="5"  rx="3" fill="white" opacity="0.3"/>

  <!-- ══ CUP / CRADLE ══ -->

  <!-- Cup outer glow ring -->
  <ellipse cx="180" cy="258" rx="40" ry="15"
           fill="white" opacity="0.08" filter="url(#glow)"/>

  <!-- Cup walls — the bowl that cradles the bubble -->
  <path d="M 141 272 Q 138 248 180 244 Q 222 248 219 272
           Q 208 281 180 283 Q 152 281 141 272 Z"
        fill="url(#cup-grad)" filter="url(#shadow-sm)"/>

  <!-- Cup inner concave dark bowl -->
  <ellipse cx="180" cy="268" rx="28" ry="12"
           fill="#0a1828" opacity="0.6"/>

  <!-- Cup inner bowl subtle blue tint -->
  <ellipse cx="180" cy="267" rx="24" ry="9.5"
           fill="#1a3060" opacity="0.4"/>

  <!-- Cup rim top lip highlight -->
  <path d="M 145 268 Q 142 246 180 242 Q 218 246 215 268"
        fill="none" stroke="white" stroke-width="2.5" stroke-opacity="0.55"
        stroke-linecap="round"/>

  <!-- Cup left edge glint -->
  <path d="M 142 270 Q 140 252 155 244"
        fill="none" stroke="white" stroke-width="2" stroke-opacity="0.38"
        stroke-linecap="round"/>

  <!-- ══ LOADED BUBBLE ══ -->

  <!-- Bubble glow halo -->
  <circle cx="180" cy="210" r="46" fill="#60d030" opacity="0.18" filter="url(#glow-lg)"/>

  <!-- Bubble body -->
  <circle cx="180" cy="210" r="40" fill="url(#b-g)"/>

  <!-- Bubble inner rim shadow -->
  <circle cx="180" cy="210" r="40" fill="none"
          stroke="#000" stroke-width="7" stroke-opacity="0.18"/>

  <!-- Bubble specular highlight -->
  <ellipse cx="165" cy="195" rx="16" ry="11.5" fill="white" opacity="0.62"
           transform="rotate(-28 165 195)"/>

  <!-- Bubble specular dot -->
  <circle cx="161" cy="191" r="6.5" fill="white" opacity="0.9"/>

  <!-- Bubble rim light (bottom) -->
  <ellipse cx="182" cy="238" rx="15" ry="5.5" fill="white" opacity="0.14"/>

  <!-- ══ SCREEN LABEL ══ -->
  <text x="180" y="496" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="13"
        fill="white" opacity="0.4" letter-spacing="1">bubble_launcher.png</text>
</svg>
