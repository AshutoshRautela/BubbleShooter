<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Bubble Asset Exporter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #061018;
      font-family: system-ui, sans-serif;
      color: #F7FBFF;
      padding: 40px 32px 80px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: #56EEFF; }
    p  { font-size: 13px; color: #9FE8FF; margin-bottom: 36px; opacity: 0.8; }

    .controls {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 40px; flex-wrap: wrap;
    }
    .controls label { font-size: 13px; color: #9FE8FF; }
    .controls select, .controls button {
      background: #0A1E2E; color: #F7FBFF;
      border: 1px solid #56EEFF; border-radius: 8px;
      padding: 8px 16px; font-size: 14px; cursor: pointer;
    }
    .controls button { background: #1a4a70; }
    .controls button:hover { background: #2060a0; }
    #download-all {
      background: #C98B34; border-color: #C98B34;
      font-weight: 700; padding: 10px 24px;
    }
    #download-all:hover { background: #e0a040; }

    .grid {
      display: flex; flex-wrap: wrap; gap: 32px;
      justify-content: flex-start;
    }
    .bubble-card {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .canvas-wrap {
      border-radius: 16px;
      background: #0A1E2E;
      padding: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }
    canvas { display: block; border-radius: 8px; }
    .bubble-name {
      font-size: 12px; color: #9FE8FF;
      letter-spacing: 1px; text-transform: uppercase; text-align: center;
    }
    .dl-btn {
      background: #0A1E2E; color: #56EEFF;
      border: 1px solid #56EEFF; border-radius: 8px;
      padding: 7px 18px; font-size: 12px; cursor: pointer;
      text-decoration: none; display: inline-block;
    }
    .dl-btn:hover { background: #1a4a70; }

    .sizes-note {
      margin-top: 48px; font-size: 12px; color: #9FE8FF; opacity: 0.6;
    }
  </style>
</head>
<body>

<h1>Bubble Asset Exporter</h1>
<p>High-resolution PNG bubbles with transparent background — for icons, UI, screenshots, and marketing.</p>

<div class="controls">
  <label>Size:
    <select id="size-select">
      <option value="128">128 × 128</option>
      <option value="256" selected>256 × 256</option>
      <option value="512">512 × 512</option>
      <option value="1024">1024 × 1024</option>
    </select>
  </label>
  <label>
    <input type="checkbox" id="bg-toggle" style="accent-color:#56EEFF"/> White background
  </label>
  <button onclick="renderAll()">Re-render</button>
  <button id="download-all" onclick="downloadAll()">⬇ Download All PNGs</button>
</div>

<div class="grid" id="grid"></div>

<p class="sizes-note">
  Tip: 256px is good for in-game UI. 512px for app store screenshots. 1024px for marketing art.
</p>

<script>
const BUBBLES = [
  { name: 'red',    hex: '#ff6b6b', light: '#ffb3b3', dark: '#c43030', glow: '#ff6b6b' },
  { name: 'yellow', hex: '#ffd166', light: '#fff0aa', dark: '#c08820', glow: '#ffd166' },
  { name: 'teal',   hex: '#4ecdc4', light: '#aaf4f0', dark: '#1a9b93', glow: '#4ecdc4' },
  { name: 'blue',   hex: '#5dade2', light: '#aad8f8', dark: '#1a68ac', glow: '#5dade2' },
  { name: 'purple', hex: '#a78bfa', light: '#d4c0ff', dark: '#6030d6', glow: '#a78bfa' },
  { name: 'green',  hex: '#95e06c', light: '#c8f8a0', dark: '#3ea030', glow: '#95e06c' },
];

function drawBubble(canvas, color, size, whiteBg) {
  const ctx = canvas.getContext('2d');
  const cx = size / 2;
  const cy = size / 2;
  const r  = size * 0.42;   // bubble radius, leaving room for glow

  ctx.clearRect(0, 0, size, size);

  // Optional white background
  if (whiteBg) {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);
  }

  // ── Outer glow ──
  const glowGrad = ctx.createRadialGradient(cx, cy, r * 0.6, cx, cy, r * 1.35);
  glowGrad.addColorStop(0, hexAlpha(color.glow, 0.28));
  glowGrad.addColorStop(1, hexAlpha(color.glow, 0));
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.35, 0, Math.PI * 2);
  ctx.fillStyle = glowGrad;
  ctx.fill();

  // ── Main bubble body ──
  // Radial gradient: bright top-left → saturated mid → dark bottom-right
  const bodyGrad = ctx.createRadialGradient(
    cx - r * 0.28, cy - r * 0.30, r * 0.04,
    cx + r * 0.05, cy + r * 0.05, r
  );
  bodyGrad.addColorStop(0,    color.light);
  bodyGrad.addColorStop(0.42, color.hex);
  bodyGrad.addColorStop(1,    color.dark);

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = bodyGrad;
  ctx.fill();

  // ── Inner rim shadow (depth) ──
  const rimShadow = ctx.createRadialGradient(cx, cy, r * 0.55, cx, cy, r);
  rimShadow.addColorStop(0,   'rgba(0,0,0,0)');
  rimShadow.addColorStop(0.8, 'rgba(0,0,0,0)');
  rimShadow.addColorStop(1,   'rgba(0,0,0,0.22)');
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = rimShadow;
  ctx.fill();

  // ── Specular highlight (top-left, rotated ellipse) ──
  ctx.save();
  ctx.translate(cx - r * 0.26, cy - r * 0.26);
  ctx.rotate(-0.52);
  ctx.scale(1.0, 0.65);
  const specGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.44);
  specGrad.addColorStop(0,   'rgba(255,255,255,0.72)');
  specGrad.addColorStop(0.5, 'rgba(255,255,255,0.28)');
  specGrad.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.44, 0, Math.PI * 2);
  ctx.fillStyle = specGrad;
  ctx.fill();
  ctx.restore();

  // ── Secondary small specular dot ──
  const dot = ctx.createRadialGradient(
    cx - r * 0.42, cy - r * 0.40, 0,
    cx - r * 0.42, cy - r * 0.40, r * 0.12
  );
  dot.addColorStop(0,   'rgba(255,255,255,0.9)');
  dot.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.arc(cx - r * 0.42, cy - r * 0.40, r * 0.12, 0, Math.PI * 2);
  ctx.fillStyle = dot;
  ctx.fill();

  // ── Bottom rim light ──
  ctx.save();
  ctx.translate(cx + r * 0.08, cy + r * 0.52);
  ctx.scale(1.0, 0.38);
  const rimGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.48);
  rimGrad.addColorStop(0,   'rgba(255,255,255,0.18)');
  rimGrad.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.48, 0, Math.PI * 2);
  ctx.fillStyle = rimGrad;
  ctx.fill();
  ctx.restore();
}

function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function getSize()   { return parseInt(document.getElementById('size-select').value); }
function getWhiteBg(){ return document.getElementById('bg-toggle').checked; }

function renderAll() {
  const size    = getSize();
  const whiteBg = getWhiteBg();
  const grid    = document.getElementById('grid');
  grid.innerHTML = '';

  const previewSize = Math.min(size, 160);

  BUBBLES.forEach(color => {
    // Full-res canvas (for download)
    const fullCanvas = document.createElement('canvas');
    fullCanvas.width  = size;
    fullCanvas.height = size;
    fullCanvas.id     = `canvas-${color.name}`;
    fullCanvas.style.display = 'none';
    document.body.appendChild(fullCanvas);
    drawBubble(fullCanvas, color, size, whiteBg);

    // Preview canvas
    const preview = document.createElement('canvas');
    preview.width  = previewSize;
    preview.height = previewSize;
    drawBubble(preview, color, previewSize, whiteBg);

    // Download link
    const dlLink = document.createElement('a');
    dlLink.className   = 'dl-btn';
    dlLink.textContent = `⬇ bubble_${color.name}.png`;
    dlLink.href        = fullCanvas.toDataURL('image/png');
    dlLink.download    = `bubble_${color.name}_${size}px.png`;

    const wrap = document.createElement('div');
    wrap.className = 'canvas-wrap';
    wrap.appendChild(preview);

    const nameEl = document.createElement('div');
    nameEl.className = 'bubble-name';
    nameEl.textContent = color.name;

    const card = document.createElement('div');
    card.className = 'bubble-card';
    card.appendChild(wrap);
    card.appendChild(nameEl);
    card.appendChild(dlLink);
    grid.appendChild(card);
  });
}

function downloadAll() {
  const size = getSize();
  BUBBLES.forEach((color, i) => {
    setTimeout(() => {
      const canvas = document.getElementById(`canvas-${color.name}`);
      if (!canvas) return;
      const a = document.createElement('a');
      a.href     = canvas.toDataURL('image/png');
      a.download = `bubble_${color.name}_${size}px.png`;
      a.click();
    }, i * 200);
  });
}

// Auto-render on load
renderAll();
document.getElementById('size-select').addEventListener('change', renderAll);
document.getElementById('bg-toggle').addEventListener('change', renderAll);
</script>
</body>
</html>
