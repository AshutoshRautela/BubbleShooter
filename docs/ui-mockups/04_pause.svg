<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" width="360" height="780"
     font-family="'Nunito', system-ui, sans-serif">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Titan+One&amp;family=Nunito:wght@400;600;700;800&amp;display=swap');</style>

    <radialGradient id="bg-grad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2060CC"/>
      <stop offset="100%" stop-color="#091A6A"/>
    </radialGradient>
    <radialGradient id="b-r" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffaaaa"/>
      <stop offset="50%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#c73c3c"/>
    </radialGradient>
    <radialGradient id="b-y" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffecaa"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#c99230"/>
    </radialGradient>
    <radialGradient id="b-t" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#aaf0eb"/>
      <stop offset="50%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#1e9b93"/>
    </radialGradient>
    <radialGradient id="b-b" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#aad8f4"/>
      <stop offset="50%" stop-color="#5dade2"/>
      <stop offset="100%" stop-color="#1e6aac"/>
    </radialGradient>
    <radialGradient id="b-p" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#d0c0fd"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6840d6"/>
    </radialGradient>
    <radialGradient id="b-g" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#c2f4a0"/>
      <stop offset="50%" stop-color="#95e06c"/>
      <stop offset="100%" stop-color="#4ea83c"/>
    </radialGradient>

    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E50B0"/>
      <stop offset="100%" stop-color="#122E80"/>
    </linearGradient>
    <linearGradient id="btn-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9D2E"/>
      <stop offset="100%" stop-color="#E06000"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="card-shadow" x="-8%" y="-6%" width="116%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#051040" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="360" height="780" fill="url(#bg-grad)"/>

  <!-- Ghost bubble grid behind overlay (colored, low opacity) -->
  <g opacity="0.12">
    <circle cx="20"  cy="116" r="16" fill="url(#b-t)"/>
    <circle cx="60"  cy="116" r="16" fill="url(#b-r)"/>
    <circle cx="100" cy="116" r="16" fill="url(#b-p)"/>
    <circle cx="140" cy="116" r="16" fill="url(#b-y)"/>
    <circle cx="180" cy="116" r="16" fill="url(#b-b)"/>
    <circle cx="220" cy="116" r="16" fill="url(#b-g)"/>
    <circle cx="260" cy="116" r="16" fill="url(#b-r)"/>
    <circle cx="300" cy="116" r="16" fill="url(#b-t)"/>
    <circle cx="340" cy="116" r="16" fill="url(#b-p)"/>
    <circle cx="40"  cy="149" r="16" fill="url(#b-y)"/>
    <circle cx="80"  cy="149" r="16" fill="url(#b-b)"/>
    <circle cx="120" cy="149" r="16" fill="url(#b-g)"/>
    <circle cx="160" cy="149" r="16" fill="url(#b-r)"/>
    <circle cx="200" cy="149" r="16" fill="url(#b-p)"/>
    <circle cx="240" cy="149" r="16" fill="url(#b-t)"/>
    <circle cx="280" cy="149" r="16" fill="url(#b-y)"/>
    <circle cx="320" cy="149" r="16" fill="url(#b-b)"/>
    <circle cx="20"  cy="182" r="16" fill="url(#b-g)"/>
    <circle cx="60"  cy="182" r="16" fill="url(#b-r)"/>
    <circle cx="140" cy="182" r="16" fill="url(#b-t)"/>
    <circle cx="180" cy="182" r="16" fill="url(#b-y)"/>
    <circle cx="220" cy="182" r="16" fill="url(#b-b)"/>
    <circle cx="300" cy="182" r="16" fill="url(#b-p)"/>
    <circle cx="340" cy="182" r="16" fill="url(#b-g)"/>
    <circle cx="80"  cy="215" r="16" fill="url(#b-p)"/>
    <circle cx="120" cy="215" r="16" fill="url(#b-t)"/>
    <circle cx="200" cy="215" r="16" fill="url(#b-g)"/>
    <circle cx="240" cy="215" r="16" fill="url(#b-r)"/>
  </g>

  <!-- Dark overlay -->
  <rect width="360" height="780" fill="#040D28" opacity="0.65"/>

  <!-- Decorative depth circles (visible through overlay) -->
  <circle cx="60"  cy="140" r="90"  fill="white" opacity="0.02"/>
  <circle cx="310" cy="660" r="95"  fill="white" opacity="0.015"/>

  <!-- PAUSE CARD -->
  <rect x="28" y="218" width="304" height="346" rx="20" fill="url(#card-bg)" filter="url(#card-shadow)"
        stroke="white" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Pause icon circle -->
  <circle cx="180" cy="274" r="32" fill="white" opacity="0.12"/>
  <circle cx="180" cy="274" r="28" fill="#1040A0" stroke="white" stroke-width="2.5"/>
  <!-- Pause bars -->
  <rect x="171" y="262" width="8" height="23" rx="4" fill="white"/>
  <rect x="183" y="262" width="8" height="23" rx="4" fill="white"/>

  <!-- PAUSED title — white cartoon outline -->
  <text x="183" y="340" font-family="'Titan One', cursive" font-size="46"
        text-anchor="middle" fill="#040e3a" opacity="0.7">PAUSED</text>
  <text x="180" y="336" font-family="'Titan One', cursive" font-size="46" text-anchor="middle"
        paint-order="stroke fill" stroke="#040e3a" stroke-width="12" stroke-linejoin="round"
        fill="white" letter-spacing="3">PAUSED</text>

  <!-- Divider -->
  <line x1="56" y1="352" x2="304" y2="352" stroke="white" stroke-width="1" opacity="0.2"/>

  <!-- Wave and score -->
  <text x="180" y="380" font-family="'Nunito', system-ui, sans-serif" font-size="15"
        fill="white" text-anchor="middle" font-weight="700" opacity="0.85">Wave 24</text>
  <text x="180" y="412" font-family="'Titan One', cursive" font-size="22" fill="#FFD233" text-anchor="middle"
        paint-order="stroke fill" stroke="#091A6A" stroke-width="5" stroke-linejoin="round">Score: 12,450</text>

  <!-- RESUME button — orange 3D -->
  <rect x="60" y="434" width="240" height="52" rx="14" fill="#B85000"/>
  <rect x="60" y="428" width="240" height="52" rx="14" fill="url(#btn-orange)"/>
  <rect x="64" y="431" width="232" height="18" rx="10" fill="white" opacity="0.22"/>
  <text x="180" y="461" font-family="'Titan One', cursive" font-size="20" text-anchor="middle"
        paint-order="stroke fill" stroke="#7a2800" stroke-width="4" stroke-linejoin="round"
        fill="white" letter-spacing="1">RESUME</text>

  <!-- SETTINGS button — blue outline -->
  <rect x="60" y="492" width="240" height="46" rx="14" fill="#1040A0" stroke="white" stroke-width="2.5"/>
  <rect x="64" y="495" width="232" height="16" rx="8" fill="white" opacity="0.12"/>
  <text x="180" y="522" font-family="'Titan One', cursive" font-size="18" text-anchor="middle"
        paint-order="stroke fill" stroke="#0a2060" stroke-width="4" stroke-linejoin="round"
        fill="white">SETTINGS</text>

  <!-- MAIN MENU button — white outline, red/coral text -->
  <rect x="60" y="550" width="240" height="46" rx="14" fill="white" fill-opacity="0.1" stroke="white" stroke-width="2" stroke-opacity="0.5"/>
  <text x="180" y="580" font-family="'Titan One', cursive" font-size="18" text-anchor="middle"
        paint-order="stroke fill" stroke="#5a0000" stroke-width="4" stroke-linejoin="round"
        fill="#FF5555">MAIN MENU</text>

  <!-- Tap outside hint -->
  <text x="180" y="712" font-family="'Nunito', system-ui, sans-serif" font-size="12"
        fill="white" text-anchor="middle" opacity="0.35">tap outside to resume</text>

  <!-- Screen label -->
  <text x="180" y="762" font-size="11" fill="white" text-anchor="middle" opacity="0.3"
        font-family="'Nunito', system-ui, sans-serif">04 — PAUSE</text>
</svg>
