<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" width="360" height="780"
     font-family="'Nunito', system-ui, sans-serif">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Titan+One&amp;family=Nunito:wght@400;600;700;800&amp;display=swap');</style>

    <radialGradient id="bg-grad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2060CC"/>
      <stop offset="100%" stop-color="#091A6A"/>
    </radialGradient>
    <radialGradient id="b-r" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffaaaa"/>
      <stop offset="50%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#c73c3c"/>
    </radialGradient>
    <radialGradient id="b-y" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffecaa"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#c99230"/>
    </radialGradient>
    <radialGradient id="b-t" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#aaf0eb"/>
      <stop offset="50%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#1e9b93"/>
    </radialGradient>
    <radialGradient id="b-b" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#aad8f4"/>
      <stop offset="50%" stop-color="#5dade2"/>
      <stop offset="100%" stop-color="#1e6aac"/>
    </radialGradient>
    <radialGradient id="b-p" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#d0c0fd"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6840d6"/>
    </radialGradient>
    <radialGradient id="b-g" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#c2f4a0"/>
      <stop offset="50%" stop-color="#95e06c"/>
      <stop offset="100%" stop-color="#4ea83c"/>
    </radialGradient>

    <linearGradient id="sheet-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E50B0"/>
      <stop offset="100%" stop-color="#122E80"/>
    </linearGradient>
    <linearGradient id="toggle-on" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6CD44A"/>
      <stop offset="100%" stop-color="#3AA020"/>
    </linearGradient>
    <linearGradient id="slider-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6CD44A"/>
      <stop offset="100%" stop-color="#3AA020"/>
    </linearGradient>
    <linearGradient id="btn-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9D2E"/>
      <stop offset="100%" stop-color="#E06000"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="card-shadow" x="-8%" y="-6%" width="116%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#051040" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="360" height="780" fill="url(#bg-grad)"/>

  <!-- Decorative depth circles -->
  <circle cx="60"  cy="140" r="90"  fill="white" opacity="0.04"/>
  <circle cx="310" cy="280" r="110" fill="white" opacity="0.03"/>

  <!-- Sparkle stars -->
  <circle cx="48"  cy="70"  r="2"   fill="white" opacity="0.65"/>
  <circle cx="310" cy="55"  r="1.5" fill="white" opacity="0.55"/>
  <circle cx="290" cy="190" r="1.5" fill="white" opacity="0.4"/>

  <!-- Ghost main menu bubbles (dim, behind overlay) -->
  <g opacity="0.12">
    <circle cx="108" cy="268" r="22" fill="url(#b-t)"/>
    <circle cx="180" cy="268" r="22" fill="url(#b-p)"/>
    <circle cx="252" cy="268" r="22" fill="url(#b-b)"/>
    <circle cx="72"  cy="316" r="22" fill="url(#b-r)"/>
    <circle cx="144" cy="316" r="22" fill="url(#b-g)"/>
    <circle cx="216" cy="316" r="22" fill="url(#b-y)"/>
    <circle cx="288" cy="316" r="22" fill="url(#b-t)"/>
    <circle cx="108" cy="364" r="22" fill="url(#b-p)"/>
    <circle cx="180" cy="364" r="22" fill="url(#b-r)"/>
    <circle cx="252" cy="364" r="22" fill="url(#b-g)"/>
  </g>

  <!-- Dim overlay -->
  <rect width="360" height="780" fill="#040D28" opacity="0.62"/>

  <!-- BOTTOM SHEET — blue gradient, rounded top -->
  <rect x="0" y="220" width="360" height="560" rx="24" fill="url(#sheet-bg)" filter="url(#card-shadow)"/>
  <!-- Cover bottom rounded corners -->
  <rect x="0" y="244" width="360" height="536" fill="url(#sheet-bg)"/>
  <!-- White top border -->
  <path d="M0 244 Q0 220 24 220 L336 220 Q360 220 360 244" fill="none" stroke="white" stroke-width="2.5" stroke-opacity="0.55"/>

  <!-- Drag handle -->
  <rect x="150" y="234" width="60" height="5" rx="2.5" fill="white" opacity="0.35"/>

  <!-- SETTINGS title — white cartoon outline -->
  <text x="183" y="294" font-family="'Titan One', cursive" font-size="36"
        text-anchor="middle" fill="#040e3a" opacity="0.7">SETTINGS</text>
  <text x="180" y="290" font-family="'Titan One', cursive" font-size="36" text-anchor="middle"
        paint-order="stroke fill" stroke="#040e3a" stroke-width="12" stroke-linejoin="round"
        fill="white" letter-spacing="2">SETTINGS</text>

  <!-- Divider -->
  <line x1="24" y1="304" x2="336" y2="304" stroke="white" stroke-width="1" opacity="0.15"/>

  <!-- SECTION: AUDIO -->
  <text x="24" y="328" font-family="'Titan One', cursive" font-size="10" fill="white"
        letter-spacing="3" opacity="0.6">AUDIO</text>

  <!-- Sound Effects row -->
  <text x="24" y="362" font-family="'Nunito', system-ui, sans-serif" font-size="17"
        fill="white" font-weight="700">Sound Effects</text>
  <!-- ON toggle — bright green -->
  <rect x="284" y="346" width="52" height="28" rx="14" fill="#267A0A" opacity="0.4"/>
  <rect x="284" y="346" width="52" height="28" rx="14" fill="url(#toggle-on)"/>
  <rect x="286" y="348" width="48" height="12" rx="6" fill="white" opacity="0.18"/>
  <!-- ON knob -->
  <circle cx="322" cy="360" r="11" fill="white" filter="url(#glow-sm)"/>
  <text x="301" y="365" font-family="'Nunito', system-ui, sans-serif" font-size="9"
        fill="#267A0A" font-weight="800">ON</text>

  <!-- Music row -->
  <text x="24" y="406" font-family="'Nunito', system-ui, sans-serif" font-size="17"
        fill="white" font-weight="700">Music</text>
  <!-- OFF toggle — grey -->
  <rect x="284" y="390" width="52" height="28" rx="14" fill="#3050A0" stroke="white" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- OFF knob -->
  <circle cx="298" cy="404" r="11" fill="white" opacity="0.5"/>
  <text x="318" y="409" font-family="'Nunito', system-ui, sans-serif" font-size="9"
        fill="white" opacity="0.65" font-weight="700">OFF</text>

  <!-- Volume row -->
  <text x="24" y="448" font-family="'Nunito', system-ui, sans-serif" font-size="17"
        fill="white" font-weight="700">Volume</text>
  <!-- Slider track -->
  <rect x="160" y="442" width="160" height="6" rx="3" fill="#1040A0" stroke="white" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Slider fill — green -->
  <rect x="160" y="442" width="106" height="6" rx="3" fill="url(#slider-fill)" opacity="0.9"/>
  <!-- Slider thumb -->
  <circle cx="266" cy="445" r="11" fill="white" opacity="0.25" filter="url(#glow)"/>
  <circle cx="266" cy="445" r="10" fill="white" stroke="#3AA020" stroke-width="2"/>

  <!-- Divider -->
  <line x1="24" y1="470" x2="336" y2="470" stroke="white" stroke-width="1" opacity="0.15"/>

  <!-- SECTION: GRAPHICS -->
  <text x="24" y="492" font-family="'Titan One', cursive" font-size="10" fill="white"
        letter-spacing="3" opacity="0.6">GRAPHICS</text>

  <!-- Quality row -->
  <text x="24" y="528" font-family="'Nunito', system-ui, sans-serif" font-size="17"
        fill="white" font-weight="700">Quality</text>
  <!-- LOW chip — inactive -->
  <rect x="210" y="513" width="48" height="28" rx="8" fill="#1040A0" stroke="white" stroke-width="1.5" stroke-opacity="0.35"/>
  <text x="234" y="532" font-family="'Titan One', cursive" font-size="12" fill="white"
        text-anchor="middle" opacity="0.55">LOW</text>
  <!-- HIGH chip — active, bright -->
  <rect x="266" y="513" width="54" height="28" rx="8" fill="#6CD44A"/>
  <rect x="268" y="515" width="50" height="10" rx="5" fill="white" opacity="0.22"/>
  <text x="293" y="532" font-family="'Titan One', cursive" font-size="12" fill="white"
        text-anchor="middle" paint-order="stroke fill" stroke="#0a3a00" stroke-width="3" stroke-linejoin="round">HIGH</text>

  <!-- Divider -->
  <line x1="24" y1="556" x2="336" y2="556" stroke="white" stroke-width="1" opacity="0.15"/>

  <!-- SECTION: DEBUG -->
  <text x="24" y="578" font-family="'Titan One', cursive" font-size="10" fill="white"
        letter-spacing="3" opacity="0.6">DEBUG</text>

  <!-- Show FPS row -->
  <text x="24" y="614" font-family="'Nunito', system-ui, sans-serif" font-size="17"
        fill="white" font-weight="700">Show FPS</text>
  <text x="24" y="634" font-family="'Nunito', system-ui, sans-serif" font-size="12"
        fill="white" opacity="0.5">Hidden in release builds</text>
  <!-- OFF toggle -->
  <rect x="284" y="598" width="52" height="28" rx="14" fill="#3050A0" stroke="white" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="298" cy="612" r="11" fill="white" opacity="0.5"/>
  <text x="318" y="617" font-family="'Nunito', system-ui, sans-serif" font-size="9"
        fill="white" opacity="0.65" font-weight="700">OFF</text>

  <!-- CLOSE button — orange 3D -->
  <rect x="56" y="672" width="248" height="52" rx="14" fill="#B85000"/>
  <rect x="56" y="666" width="248" height="52" rx="14" fill="url(#btn-orange)"/>
  <rect x="60" y="669" width="240" height="18" rx="10" fill="white" opacity="0.22"/>
  <text x="180" y="699" font-family="'Titan One', cursive" font-size="20" text-anchor="middle"
        paint-order="stroke fill" stroke="#7a2800" stroke-width="4" stroke-linejoin="round"
        fill="white" letter-spacing="2">CLOSE</text>

  <!-- Screen label -->
  <text x="180" y="762" font-size="11" fill="white" text-anchor="middle" opacity="0.3"
        font-family="'Nunito', system-ui, sans-serif">07 — SETTINGS</text>
</svg>
